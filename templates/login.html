<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Workflow Test App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h1>Workflow Test App</h1>
            <p class="subtitle">Log in to manage your tasks</p>

            {% if error %}
            <div class="message error">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="POST" action="/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-save">Log In</button>
            </form>

            <p class="auth-link">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </div>
</body>
</html>
