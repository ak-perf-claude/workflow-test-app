<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task #{{ task.id }} — Workflow Test App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">&larr; Back to tasks</a>

        <div id="message"></div>

        <div class="detail-card">
            <div class="detail-header">
                <span id="status-badge" class="status {{ task.status }}">{{ task.status }}</span>
                <h1 id="task-heading">Task #{{ task.id }}</h1>
            </div>

            <div class="edit-form">
                <div class="form-group">
                    <label for="title-input">Title</label>
                    <input type="text" id="title-input" value="{{ task.title }}">
                </div>

                <div class="form-group">
                    <label for="desc-input">Description</label>
                    <textarea id="desc-input" rows="4" placeholder="Add a description...">{{ task.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="status-select">Status</label>
                    <select id="status-select">
                        <option value="pending" {{ 'selected' if task.status == 'pending' }}>Pending</option>
                        <option value="done" {{ 'selected' if task.status == 'done' }}>Done</option>
                    </select>
                </div>

                <div class="detail-dates">
                    <div>
                        <span class="date-label">Created:</span>
                        <span id="created-at">{{ task.created_at }}</span>
                    </div>
                    <div>
                        <span class="date-label">Modified:</span>
                        <span id="modified-at">{{ task.modified_at }}</span>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-save" onclick="saveTask()">Save Changes</button>
                    <button class="btn-delete" onclick="deleteTask()">Delete Task</button>
                </div>
            </div>
        </div>

        <div class="subtasks-card">
            <h2>Subtasks</h2>
            <form id="subtask-form" class="subtask-add-form">
                <input type="text" id="subtask-input" placeholder="New subtask..." required>
                <button type="submit">Add</button>
            </form>
            <div id="subtask-list"></div>
            <p id="subtask-empty" class="subtask-empty">No subtasks yet.</p>
        </div>
    </div>

    <script>
        const taskId = {{ task.id }};

        document.getElementById("created-at").textContent = formatDate("{{ task.created_at }}");
        document.getElementById("modified-at").textContent = formatDate("{{ task.modified_at }}");

        async function saveTask() {
            const title = document.getElementById("title-input").value.trim();
            if (!title) return;
            const status = document.getElementById("status-select").value;
            const description = document.getElementById("desc-input").value;
            const res = await fetch(`/api/tasks/${taskId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, status, description }),
            });
            if (res.ok) {
                const task = await res.json();
                updatePage(task);
                showMessage("Task updated successfully.", "success");
            } else {
                showMessage("Failed to update task.", "error");
            }
        }

        async function deleteTask() {
            if (!confirm("Are you sure you want to delete this task?")) return;
            const res = await fetch(`/api/tasks/${taskId}`, { method: "DELETE" });
            if (res.ok) {
                window.location.href = "/";
            } else {
                showMessage("Failed to delete task.", "error");
            }
        }

        function updatePage(task) {
            const badge = document.getElementById("status-badge");
            badge.textContent = task.status;
            badge.className = "status " + task.status;
            document.getElementById("title-input").value = task.title;
            document.getElementById("desc-input").value = task.description;
            document.getElementById("status-select").value = task.status;
            document.getElementById("modified-at").textContent = formatDate(task.modified_at);
        }

        function showMessage(text, type) {
            const el = document.getElementById("message");
            el.textContent = text;
            el.className = "message " + type;
            setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
        }

        // Subtasks
        async function loadSubtasks() {
            const res = await fetch(`/api/tasks/${taskId}`);
            if (!res.ok) return;
            const task = await res.json();
            const subtasks = task.subtasks || [];
            const list = document.getElementById("subtask-list");
            const empty = document.getElementById("subtask-empty");

            if (subtasks.length === 0) {
                list.innerHTML = "";
                empty.style.display = "block";
                return;
            }
            empty.style.display = "none";
            list.innerHTML = subtasks.map(s => `
                <div class="subtask" data-id="${s.id}">
                    <span class="status ${s.status}">${s.status}</span>
                    <span class="subtask-title ${s.status === 'done' ? 'completed' : ''}">${escapeHtml(s.title)}</span>
                    <div class="actions">
                        <button onclick="toggleSubtask(${s.id})">Toggle</button>
                        <button onclick="deleteSubtask(${s.id})">Delete</button>
                    </div>
                </div>
            `).join("");
            document.getElementById("modified-at").textContent = formatDate(task.modified_at);
        }

        document.getElementById("subtask-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const input = document.getElementById("subtask-input");
            const title = input.value.trim();
            if (!title) return;
            const res = await fetch(`/api/tasks/${taskId}/subtasks`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title }),
            });
            if (res.ok) {
                input.value = "";
                loadSubtasks();
            }
        });

        async function toggleSubtask(subId) {
            const res = await fetch(`/api/tasks/${taskId}`);
            if (!res.ok) return;
            const task = await res.json();
            const sub = (task.subtasks || []).find(s => s.id === subId);
            if (!sub) return;
            const newStatus = sub.status === "pending" ? "done" : "pending";
            await fetch(`/api/tasks/${taskId}/subtasks/${subId}`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: newStatus }),
            });
            loadSubtasks();
        }

        async function deleteSubtask(subId) {
            await fetch(`/api/tasks/${taskId}/subtasks/${subId}`, { method: "DELETE" });
            loadSubtasks();
        }

        function formatDate(iso) {
            if (!iso) return "—";
            const d = new Date(iso);
            return d.toLocaleString();
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        loadSubtasks();
    </script>
</body>
</html>
